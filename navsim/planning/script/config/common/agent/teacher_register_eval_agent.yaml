worldmodel_checkpoint_path: ${oc.env:WORLD_MODEL_CHECKPOINT,/mnt/cfs/qiuzijun/WorldDrive/ckpts/worldtraj_stage1_512_tadwm.pkl}
vocab_path: ${oc.env:TRAJECTORY_VOCAB,/mnt/cfs/qiuzijun/WorldDrive/ckpts/trajectory_anchors_256.npy}
teacher_scheduler_path: ${oc.env:TEACHER_SCHEDULER_PATH,/mnt/cfs/qiuzijun/WorldDrive/ckpts/CogVideoX-2b}
pretrained_vae_path: ${oc.env:PRETRAINED_VAE_PATH,/mnt/cfs/qiuzijun/WorldDrive/ckpts/CogVideoX-2b}
